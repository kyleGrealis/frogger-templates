project:
  title: "Project Title"
  output-dir: docs
  execute-dir: project
  resources:
    - www
    - logos
  render:
    - "analysis/*.qmd"

format:
  html:
    embed-resources: true
    theme:
      - default
      - brand
      - www/custom.scss
    toc: true
    toc-location: right
    code-tools: true
    code-copy: true
    code-fold: true
    code-summary: "Show the code"
    page-layout: full
    link-external-newwindow: true
    grid:
      body-width: 1100px
      sidebar-width: 250px
      margin-width: 200px
    include-after-body:
      text: |
        <script src="../www/tables.js"></script>

number-sections: false
editor: source
